<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tela Castle — gestion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lexend:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="tela.css">
<style>
:root{--h-top:60px;--l-flanc:248px}
body{background:var(--surface-2)}

/* ---------------------------------------------------------- connexion */
.portail{min-height:100vh;display:grid;place-items:center;padding:24px}
.qui{display:grid;gap:7px}
.qui button{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
  border:var(--ep-bord) solid var(--bord);background:var(--surface);text-align:left;transition:var(--t)}
.qui button .av{width:34px;height:34px;border-radius:50%;background:var(--or-doux);color:var(--or-fonce);
  display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:14px;flex:none}
.qui button .tx{flex:1;min-width:0}
.qui button .tx b{display:block;font-size:13.5px}
.qui button .tx span{display:block;font-size:11.5px;color:var(--doux)}
.qui button[aria-pressed="true"]{border-color:var(--or);background:var(--or-doux)}
.portail .carte{width:min(400px,100%);background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r-g);padding:28px}
.portail img{width:96px;margin-bottom:18px}
.portail h1{font-size:22px}
.portail p{font-size:13px;color:var(--doux);margin-top:5px}
.portail form{display:grid;gap:12px;margin-top:20px}
.portail .aide{font-size:11.5px;color:var(--doux);text-align:center}

/* ---------------------------------------------------------- charpente */
.admin{display:none;min-height:100vh}
.admin.on{display:grid;grid-template-columns:1fr}

.flanc{background:var(--surface);border-right:var(--ep-bord) solid var(--bord);display:flex;flex-direction:column;
  transition:width .25s cubic-bezier(.4,0,.2,1)}
.flanc .marque{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:var(--ep-bord) solid var(--bord);min-height:60px}
.flanc .marque img{width:74px;transition:width .2s}
.flanc .marque .tag{font-size:10px;color:var(--doux);border:var(--ep-bord) solid var(--bord);padding:2px 7px;border-radius:999px}
.flanc nav{padding:10px;display:grid;gap:2px;flex:1;align-content:start;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.flanc nav::-webkit-scrollbar{width:0}
.flanc nav .grp{font-size:10px;color:var(--doux);text-transform:uppercase;letter-spacing:.08em;margin:14px 12px 6px}
.flanc nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:13.5px;
  color:var(--doux);text-align:left;transition:var(--t);width:100%;position:relative}
.flanc nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flanc nav button:hover{background:var(--surface-2);color:var(--encre)}
.flanc nav button.on{background:var(--encre);color:var(--fond)}
.flanc nav button .n{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rouge);
  color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.flanc nav button.on .n{background:var(--or);color:#241A12}
.flanc .bas{padding:10px;border-top:var(--ep-bord) solid var(--bord);display:grid;gap:7px}
.flanc .profil{display:flex;align-items:center;gap:10px;padding:7px 9px;font-size:12.5px}
.flanc .profil .av{width:32px;height:32px;border-radius:50%;background:var(--or-doux);color:var(--or-fonce);
  display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:13px;flex:none}
.flanc .profil b{display:block;font-weight:500}
.flanc .profil span{color:var(--doux);font-size:11px}
.replier{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:12.5px;color:var(--doux);width:100%}
.replier:hover{background:var(--surface-2);color:var(--encre)}
.replier svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none;transition:transform .25s}

/* sidebar repliée */
.admin.reduit .flanc .lib,
.admin.reduit .flanc .grp,
.admin.reduit .flanc .tag,
.admin.reduit .flanc .profil div,
.admin.reduit .flanc nav button .n{display:none}
.admin.reduit .flanc .marque{justify-content:center;padding:14px 8px}
.admin.reduit .flanc .marque img{display:none}
.admin.reduit .flanc .marque::after{content:"TC";width:34px;height:34px;border-radius:50%;background:var(--or);
  color:#241A12;font-family:var(--titre);font-weight:700;font-size:13px;display:grid;place-items:center}
.admin.reduit .flanc nav button{justify-content:center;padding:11px 0}
.admin.reduit .flanc .profil{justify-content:center;padding:7px 0}
.admin.reduit .replier{justify-content:center}
.admin.reduit .replier svg{transform:rotate(180deg)}


.zone{min-width:0;display:flex;flex-direction:column}
.haut{position:sticky;top:0;z-index:40;min-height:var(--h-top);background:var(--surface);
  border-bottom:var(--ep-bord) solid var(--bord);display:flex;align-items:center;gap:12px;padding:10px 18px}
.haut h1{font-size:17px}
.haut .fin{margin-left:auto;display:flex;align-items:center;gap:9px}
.service{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--vert-doux);
  color:var(--vert);font-size:11.5px;font-weight:500;white-space:nowrap}
.service i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal;animation:bat 2.2s ease-in-out infinite}
@keyframes bat{50%{opacity:.35}}
.contenu{padding:18px;display:grid;gap:16px;align-content:start}
.burger{display:none;width:36px;height:36px;border-radius:50%;background:var(--surface-2);place-items:center;flex:none}
.burger svg{width:18px;height:18px;stroke:var(--encre);fill:none;stroke-width:1.8}
.btn svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gal .ajout svg,.ed-photo .btn svg{stroke:currentColor;fill:none;stroke-width:1.9}

/* ---------------------------------------------------------- blocs */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r);padding:15px 17px}
.kpi .lg{font-size:11.5px;color:var(--doux)}
.kpi .v{font-family:var(--titre);font-weight:700;font-size:25px;margin-top:6px;line-height:1}
.kpi .d{font-size:11.5px;margin-top:5px;color:var(--doux)}
.kpi .d b{color:var(--vert);font-weight:500}
.kpi .d b.bas{color:var(--rouge)}
.grille2{display:grid;gap:16px}
@media (min-width:1080px){ .grille2{grid-template-columns:1.35fr .65fr} }

.panneau-b{background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r);overflow:hidden}
.panneau-b .tete{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--ep-bord) solid var(--bord);flex-wrap:wrap}
.panneau-b .tete h2{font-size:15px}
.panneau-b .tete .fin{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panneau-b .corps{padding:16px}
.panneau-b .corps.serre{padding:0}

.barres{display:flex;align-items:flex-end;gap:9px;height:140px;padding:10px 4px 0}
.barres .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.barres .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--or-doux)}
.barres .b.fort{background:var(--or)}
.barres .col span{font-size:11px;color:var(--doux)}
.barres .col b{font-size:11px;font-weight:500}

.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:200px}
.rech{display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;background:var(--surface-2);border-radius:999px;
  border:var(--ep-bord) solid transparent;min-width:170px;flex:1;max-width:260px}
.rech:focus-within{background:var(--surface);border-color:var(--encre)}
.rech input{border:0;background:none;outline:none;width:100%;font-size:13px}
.rech svg{width:15px;height:15px;stroke:var(--doux);fill:none;stroke-width:2;flex:none}

/* tableaux */
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{text-align:left;font-weight:500;font-size:11.5px;color:var(--doux);padding:11px 14px;
  border-bottom:var(--ep-bord) solid var(--bord);white-space:nowrap;background:var(--surface-2)}
.tab td{padding:11px 14px;border-bottom:var(--ep-bord) solid var(--bord);vertical-align:middle}
.tab tbody tr:last-child td{border-bottom:0}
.tab tbody tr:hover{background:var(--surface-2)}
.tab .vig{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--surface-2);flex:none}
.tab .nom{font-weight:400}
.tab .nom span{display:block;font-size:11.5px;color:var(--doux)}
.tab .px{font-family:var(--titre);font-weight:700;white-space:nowrap}
.puces{display:flex;gap:4px;flex-wrap:wrap}
.icone{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:var(--ep-bord) solid var(--bord);background:var(--surface);flex:none}
.icone:hover{border-color:var(--bord-fort);background:var(--surface-2)}
.icone svg{width:15px;height:15px;stroke:var(--encre);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icone.rouge svg{stroke:var(--rouge)}
.actions{display:flex;gap:5px;justify-content:flex-end}
.defil{overflow-x:auto}
@media (max-width:760px){ .defil{overflow:visible} .tab-carte{display:block} .tab-carte tbody{display:block} }

.pagination{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:var(--ep-bord) solid var(--bord);flex-wrap:wrap}
.pagination .info{font-size:12px;color:var(--doux)}
.pagination .pages{margin-left:auto;display:flex;gap:4px;align-items:center}
.pagination button{min-width:32px;height:32px;padding:0 9px;border-radius:8px;border:var(--ep-bord) solid var(--bord);
  background:var(--surface);font-size:12.5px}
.pagination button:hover:not([disabled]){border-color:var(--bord-fort)}
.pagination button.on{background:var(--encre);border-color:var(--encre);color:var(--fond);font-weight:500}
.pagination button[disabled]{opacity:.4;cursor:default}

/* préparation */
.prep{display:flex;align-items:center;gap:13px;padding:12px 15px;border-bottom:var(--ep-bord) solid var(--bord)}
.prep:last-child{border-bottom:0}
.prep.fait{opacity:.5}
.prep.fait .n{text-decoration:line-through}
.prep img{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:none}
.prep .q{font-family:var(--titre);font-weight:700;font-size:19px;min-width:34px;text-align:center;flex:none}
.prep .n{flex:1;min-width:0;font-size:14px}
.prep .n span{display:block;font-size:11.5px;color:var(--doux)}
.coche{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--bord-fort);display:grid;place-items:center;
  font-size:14px;flex:none;background:var(--surface)}
.coche.on{background:var(--vert);border-color:var(--vert);color:#fff}

/* tournée */
.arret{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:var(--ep-bord) solid var(--bord);cursor:pointer}
.arret:last-child{border-bottom:0}
.arret:hover{background:var(--surface-2)}
.arret .pas-num{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;
  font-size:12px;flex:none;color:var(--doux)}
.arret .n{flex:1;min-width:0;font-size:13.5px}
.arret .n span{display:block;font-size:11.5px;color:var(--doux)}
.arret .m{text-align:right;font-family:var(--titre);font-weight:700;font-size:14px;flex:none}
.arret .m span{display:block;font-family:var(--texte);font-weight:400;font-size:11px;color:var(--doux)}
@media (max-width:760px){
  .arret{flex-wrap:wrap}
  .arret .n{flex-basis:calc(100% - 100px)}
  .arret .actions{flex-basis:100%;justify-content:flex-start}
}

/* stock */
.jauge-s{width:64px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.jauge-s i{display:block;height:100%;border-radius:99px;background:var(--vert)}
.jauge-s.bas i{background:var(--or)}
.jauge-s.epuise i{background:var(--rouge)}
.stock-ctl{display:flex;align-items:center;gap:6px}
.stock-ctl input{width:56px;padding:7px 8px;border-radius:8px;border:var(--ep-bord) solid var(--bord);
  background:var(--surface);font-size:13px;text-align:center}

.bascule{width:42px;height:24px;border-radius:999px;background:var(--surface-3);position:relative;transition:var(--t);flex:none}
.bascule i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);
  transition:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bascule.on{background:var(--vert)}
.bascule.on i{left:21px}

/* commandes */
.cmd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:var(--ep-bord) solid var(--bord);width:100%;text-align:left}
.cmd:last-child{border-bottom:0}
.cmd:hover{background:var(--surface-2)}
.cmd .ref{font-family:var(--titre);font-weight:700;font-size:13.5px;min-width:108px}
.cmd .cli{font-size:13px;min-width:0;flex:1}
.cmd .cli span{display:block;font-size:11.5px;color:var(--doux)}
.cmd .det{font-size:12px;color:var(--doux);min-width:112px}
.cmd .tot{font-family:var(--titre);font-weight:700;font-size:14px;min-width:80px;text-align:right}
.cmd .act{display:flex;gap:6px;flex:none}
@media (max-width:760px){
  .cmd{flex-wrap:wrap;gap:8px}
  .cmd .ref{min-width:0}
  .cmd .cli{flex-basis:100%;order:3}
  .cmd .det{min-width:0;order:4}
  .cmd .tot{margin-left:auto}
  .cmd .act{order:5;flex-basis:100%}
  .cmd .act .btn{width:100%}
}

.code-p{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  background:var(--encre);color:var(--fond);padding:6px 10px;border-radius:8px;flex:none}
.bascule{display:flex;align-items:center;gap:10px;padding:11px 0;font-size:13.5px;cursor:pointer}
.bascule input{width:17px;height:17px;accent-color:var(--or-fonce)}
.jours-g{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.jours-g::-webkit-scrollbar{display:none}
.jours-g button{flex:none;width:54px;padding:8px 0 9px;border-radius:14px;background:var(--surface);
  border:var(--ep-bord) solid var(--bord);display:grid;gap:1px;justify-items:center}
.jours-g .j{font-size:10px;color:var(--doux);text-transform:uppercase}
.jours-g .d{font-family:var(--titre);font-weight:700;font-size:17px;line-height:1.1}
.jours-g .m{font-size:10px;color:var(--doux)}
.jours-g button[aria-pressed="true"]{background:var(--encre);border-color:var(--encre);color:var(--fond)}
.jours-g button[aria-pressed="true"] .j,.jours-g button[aria-pressed="true"] .m{color:rgba(255,255,255,.7)}
.preuve{display:grid;gap:9px;padding:12px 15px;border-top:var(--ep-bord) solid var(--bord)}
.preuve img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
.av-r{width:34px;height:34px;border-radius:50%;background:var(--or-doux);color:var(--or-fonce);flex:none;
  display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:14px}
select.mini{padding:7px 10px;border-radius:9px;border:var(--ep-bord) solid var(--bord);
  background:var(--surface);font-size:12.5px;color:var(--encre);max-width:150px}
.dd-plat{flex:none}
.tiroir .dedans .champ{margin-bottom:12px}
.tiroir .dedans .champ input{width:100%;padding:11px 13px;border-radius:10px;
  border:var(--ep-bord) solid var(--bord);background:var(--surface);font-size:13.5px}
.tiroir .dedans h3{font-size:17px;margin-bottom:14px}

/* tiroir */
.voile{position:fixed;inset:0;z-index:90;background:rgba(20,14,9,.45);opacity:0;pointer-events:none;transition:opacity var(--t)}
.voile.on{opacity:1;pointer-events:auto}
.tiroir{position:fixed;z-index:95;top:0;bottom:0;right:0;width:min(560px,100%);background:var(--fond);
  border-left:var(--ep-bord) solid var(--bord);display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1)}
.tiroir.on{transform:none}
.tiroir .tete{flex:none;display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:var(--ep-bord) solid var(--bord)}
.tiroir .tete h3{font-size:16.5px}
.tiroir .dedans{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px;display:grid;gap:16px;align-content:start;
  scrollbar-width:none}
.tiroir .dedans::-webkit-scrollbar{width:0;height:0}
.tiroir .pied{flex:none;padding:13px 16px;border-top:var(--ep-bord) solid var(--bord);background:var(--surface);display:grid;gap:8px}
.fermer{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin-left:auto;flex:none}

.lignes-det{display:grid;gap:10px}
.lignes-det .l{display:flex;gap:11px;align-items:flex-start;padding-bottom:10px;border-bottom:var(--ep-bord) solid var(--bord)}
.lignes-det .l:last-child{border-bottom:0}
.lignes-det img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none}
.lignes-det b{font-size:13.5px;font-weight:500}
.lignes-det span{font-size:11.5px;color:var(--doux)}
.lignes-det .px{margin-left:auto;font-family:var(--titre);font-weight:700;font-size:13.5px}
.journal{display:grid;gap:8px}
.journal .j{display:flex;gap:10px;font-size:12.5px;color:var(--doux)}
.journal .j b{color:var(--encre);font-weight:500}

/* ---------------------------------------------------------- éditeur produit */
.ed-photo{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);
  border:var(--ep-bord) solid var(--bord)}
.ed-photo img{width:100%;height:180px;object-fit:cover}
.ed-photo .sur{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;gap:8px;
  background:linear-gradient(180deg,rgba(20,14,9,0),rgba(20,14,9,.7))}
.ed-photo .sur .btn{height:34px;font-size:12.5px;padding:0 14px}
.ed-titre{display:grid;gap:3px}
.ed-titre h4{font-size:17px}
.ed-titre span{font-size:11.5px;color:var(--doux)}

.bloc-ed{background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r);padding:14px}
.bloc-ed > .t{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.bloc-ed > .t h5{font-size:12.5px;font-family:var(--texte);font-weight:500;color:var(--doux);
  text-transform:uppercase;letter-spacing:.06em}
.bloc-ed > .t .fin{margin-left:auto}

.ligne-fmt{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ligne-fmt input[type=text]{flex:1;min-width:0;background:var(--surface);border:var(--ep-bord) solid var(--bord);
  border-radius:var(--r-s);padding:10px 12px;font-size:13px}
.mont{position:relative;flex:none;width:122px}
.mont input{width:100%;background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r-s);
  padding:10px 30px 10px 12px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.mont .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--doux);pointer-events:none}
.ligne-fmt input:focus,.mont input:focus{outline:none;border-color:var(--or)}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:9px;max-height:260px;overflow-y:auto;padding:2px}
.gal button{position:relative;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;border:2px solid transparent;background:var(--surface-2)}
.gal button img{width:100%;height:100%;object-fit:cover}
.gal button[aria-pressed="true"]{border-color:var(--or)}
.gal button[aria-pressed="true"]::after{content:"✓";position:absolute;top:5px;right:5px;width:19px;height:19px;
  border-radius:50%;background:var(--or);color:#241A12;font-size:11px;display:grid;place-items:center}
.gal .ajout{display:grid;place-items:center;gap:5px;border:1.5px dashed var(--bord-fort);color:var(--doux);font-size:11px;text-align:center;padding:6px}
.gal .ajout svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9}
.gal .sup{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:rgba(20,14,9,.7);
  color:#fff;font-size:11px;display:grid;place-items:center;opacity:0;transition:opacity var(--t)}
.gal button:hover .sup{opacity:1}

.puce-cat{display:flex;gap:7px;flex-wrap:wrap}
.puce-cat button{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  border:var(--ep-bord) solid var(--bord);background:var(--surface);font-size:12.5px;color:var(--doux)}
.puce-cat button:hover{border-color:var(--bord-fort);color:var(--encre)}
.puce-cat button[aria-pressed="true"]{background:var(--or-doux);border-color:var(--or);color:var(--encre);font-weight:500}
.puce-cat button .c{width:15px;height:15px;border-radius:50%;border:var(--ep-bord) solid var(--bord-fort);display:grid;place-items:center;font-size:9px}
.puce-cat button[aria-pressed="true"] .c{background:var(--or);border-color:var(--or);color:#241A12}

.deux-ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){ .deux-ch{grid-template-columns:1fr} }

/* catégories */
.cat-l{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:var(--ep-bord) solid var(--bord);flex-wrap:wrap}
.cat-l:last-child{border-bottom:0}
.cat-l img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none}
.cat-l .n{flex:1;min-width:140px;font-size:14px}
.cat-l .n span{display:block;font-size:11.5px;color:var(--doux)}
.ordre{display:flex;flex-direction:column;gap:2px}
.ordre button{width:22px;height:18px;border-radius:5px;display:grid;place-items:center;border:var(--ep-bord) solid var(--bord);background:var(--surface);font-size:9px}

/* semaine */
.semaine{display:grid;gap:12px}
@media (min-width:1100px){ .semaine{grid-template-columns:repeat(5,1fr)} }
.jour{background:var(--surface);border:var(--ep-bord) solid var(--bord);border-radius:var(--r);overflow:hidden}
.jour .t{padding:11px 13px;border-bottom:var(--ep-bord) solid var(--bord);font-family:var(--titre);font-weight:700;
  font-size:13.5px;display:flex;align-items:center;gap:8px}
.jour .g{padding:10px 13px;border-bottom:var(--ep-bord) solid var(--bord)}
.jour .g:last-child{border-bottom:0}
.jour .g h5{font-size:10.5px;color:var(--doux);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;font-family:var(--texte);font-weight:500}
.jour .pl{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
.jour .pl .x{margin-left:auto;color:var(--doux);font-size:14px;line-height:1}
.jour .pl .x:hover{color:var(--rouge)}

/* clients & réglages */
.cli-l{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:var(--ep-bord) solid var(--bord);width:100%;text-align:left;flex-wrap:wrap}
.cli-l:last-child{border-bottom:0}
.cli-l:hover{background:var(--surface-2)}
.cli-l .av{width:38px;height:38px;border-radius:50%;background:var(--or-doux);color:var(--or-fonce);display:grid;place-items:center;font-family:var(--titre);font-weight:700;flex:none}
.cli-l .n{flex:1;min-width:150px;font-size:13.5px}
.cli-l .n span{display:block;font-size:11.5px;color:var(--doux)}
.reglages{display:grid;gap:16px}
@media (min-width:900px){ .reglages{grid-template-columns:1fr 1fr} }
.rang{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:var(--ep-bord) solid var(--bord)}
.rang:last-child{border-bottom:0}
.rang .tx{flex:1;min-width:0}
.rang .tx b{display:block;font-size:13.5px;font-weight:500}
.rang .tx span{font-size:11.5px;color:var(--doux)}
/* 120 px fixes tronquaient le numéro de téléphone. Les champs de texte
   respirent, les champs numériques restent compacts. */
.rang input{flex:0 0 110px;padding:8px 11px;border-radius:9px;border:var(--ep-bord) solid var(--bord);
  background:var(--surface);font-size:13px;text-align:right;min-width:0}
.rang input[type="text"]{flex:0 1 240px;text-align:left}
.rang input:focus{outline:none;border-color:var(--or)}
@media (max-width:520px){ .rang input[type="text"]{flex:1 1 140px} }

@media print{
  body *{visibility:hidden}
  #zoneImpression, #zoneImpression *{visibility:visible}
  #zoneImpression{position:absolute;left:0;top:0;width:80mm;border:0}
}

}
/* ---------------------------------------------------------- navigation mobile */
.barre-nav{display:none}
.feuille{position:fixed;z-index:97;left:0;right:0;bottom:0;background:var(--fond);

.feuille.on{transform:none}
.feuille .poignee{width:38px;height:4px;border-radius:99px;background:var(--bord-fort);margin:0 auto 12px}
.feuille .items{display:grid;gap:3px}
.feuille .items button{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:11px;
  font-size:14px;color:var(--encre);text-align:left;width:100%}
.feuille .items button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.feuille .items button:hover{background:var(--surface-2)}
.feuille .items button.on{background:var(--encre);color:var(--fond)}
.feuille .pied-f{display:flex;align-items:center;gap:11px;margin-top:12px;padding-top:12px;border-top:var(--ep-bord) solid var(--bord)}
.feuille .pied-f .av{width:34px;height:34px;border-radius:50%;background:var(--or-doux);color:var(--or-fonce);
  display:grid;place-items:center;font-family:var(--titre);font-weight:700;font-size:13px;flex:none}
.feuille .pied-f b{display:block;font-size:13px;font-weight:500}
.feuille .pied-f span{font-size:11.5px;color:var(--doux)}
.feuille .pied-f .themes{margin-left:auto}

@media (max-width:899px){
  .flanc{position:fixed;z-index:96;top:0;bottom:0;left:0;width:264px;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--ombre-flot)}
  .flanc.on{transform:none}
  /* pas de tiroir latéral sur mobile : une barre de navigation en bas */
  .flanc{display:none}
  .contenu{padding:13px 13px 96px}

  .barre-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));

    border-radius:999px;box-shadow:var(--ombre-flot);max-width:calc(100vw - 20px)}
  .barre-nav button{position:relative;display:grid;place-items:center;width:52px;height:48px;border-radius:999px;
    color:var(--doux);transition:var(--t)}
  .barre-nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .barre-nav .lib{display:none}
  .barre-nav button.on{background:var(--encre);color:var(--fond)}
  .barre-nav button.on svg{stroke-width:2.1}
  .barre-nav .n{position:absolute;top:4px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
    background:var(--rouge);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;
    border:2px solid var(--surface)}
  .barre-nav button.on .n{border-color:var(--encre)}
  .barre-nav .n[hidden]{display:none}
  /* en tiroir mobile la barre est large : on annule le mode replié */
  .admin.reduit .flanc .lib,.admin.reduit .flanc .grp,.admin.reduit .flanc .profil div{display:block}

  .admin.reduit .flanc .marque{justify-content:flex-start;padding:14px 16px}

  .admin.reduit .flanc .marque::after{content:none}

  .replier{display:none}
  .tiroir{width:100%}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>

  type = type || 'succes';
  var pile = $('#toasts');
  var t = el('div','toast ' + type);
  t.style.position = 'relative';
  t.appendChild(el('span','ic', type === 'succes' ? IC.ok : type === 'erreur' || type === 'alerte' ? IC.alerte : IC.info));
  t.appendChild(el('div','tx', '<b>' + titre + '</b>' + (detail ? '<span>' + detail + '</span>' : '')));
  var x = el('button','x','✕'); x.setAttribute('aria-label','Fermer');
  x.onclick = function(){ sortir(); };
  t.appendChild(x);
  var barre = el('span','barre'); barre.style.width = '100%';
  t.appendChild(barre);
  pile.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('on'); barre.style.transition = 'width 3.4s linear'; barre.style.width = '0%'; });
  var minuteur = setTimeout(sortir, 3400);
  function sortir(){
    clearTimeout(minuteur);
    t.classList.add('sort');
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 300);
  }
  while (pile.children.length > 4) pile.removeChild(pile.firstChild);
}

var ddOuvert = null;
function dd(config){
  /* config : {label, valeur, options:[{v,label,img}], onChange, aligne:'droite'} */
  var box = el('div','dd');
  var bouton = el('button');
  var lbl = config.label ? '<span class="lbl">' + config.label + '</span>' : '';
  function libelle(){
    var o = config.options.filter(function(x){ return x.v === config.valeur; })[0];
    return o ? o.label : '—';
  }
  bouton.innerHTML = lbl + '<span class="val">' + libelle() + '</span>' + IC.chevron;
  bouton.setAttribute('aria-haspopup','listbox');
  box.appendChild(bouton);

  var liste = el('div','liste' + (config.aligne === 'droite' ? ' droite' : ''));
  liste.setAttribute('role','listbox');
  config.options.forEach(function(o){
    if (o.titre){ liste.appendChild(el('div','titre', o.titre)); return; }
    var b = el('button');
    b.setAttribute('role','option');
    b.setAttribute('aria-selected', o.v === config.valeur);
    if (o.img) b.appendChild(function(){ var i = el('img'); i.src = T.img(o.img); i.alt = ''; return i; }());
    b.appendChild(el('span', null, o.label));
    if (o.v === config.valeur) b.appendChild(el('span','coche', '✓'));
    b.onclick = function(e){
      e.stopPropagation();
      config.valeur = o.v;
      fermerDd();
      config.onChange(o.v);
    };
    liste.appendChild(b);
  });
  box.appendChild(liste);

  bouton.onclick = function(e){
    e.stopPropagation();
    if (box.classList.contains('ouvert')){ fermerDd(); return; }
    fermerDd();
    box.classList.add('ouvert');
    ddOuvert = box;
  };
  return box;
}
function fermerDd(){
  if (ddOuvert){ ddOuvert.classList.remove('ouvert'); ddOuvert = null; }
}

function aValider(){ return cmds().filter(function(c){ return c.statut === 'recue'; }); }

function alertes(){ return idsProduits().filter(function(id){ var e = T.etatStock(id); return e === 'epuise' || e === 'bas' || e === 'retire'; }); }
function badges(){
  var n1 = aValider().length, n2 = alertes().length;
  var np = cmds().filter(function(x){

function etq(statut){

}
function etqStock(id){
  var e = T.etatStock(id), p = T.produits[id];
  if (e === 'retire') return '<span class="etq">Retiré</span>';

function pagine(liste, cle){
  var e = etat[cle];
  var pages = Math.max(1, Math.ceil(liste.length / PAR_PAGE));
  if (e.page > pages) e.page = pages;
  return {pages:pages, tranche:liste.slice((e.page-1)*PAR_PAGE, e.page*PAR_PAGE), total:liste.length};
}
function barrePagination(res, cle){
  var e = etat[cle];
  var p = el('div','pagination');
  var debut = res.total ? (e.page-1)*PAR_PAGE + 1 : 0;
  p.appendChild(el('span','info', debut + '–' + Math.min(e.page*PAR_PAGE, res.total) + ' sur ' + res.total));
  var pg = el('div','pages');
  var prec = el('button', null, '‹'); prec.disabled = e.page <= 1;
  prec.onclick = function(){ e.page--; rendre(); };
  pg.appendChild(prec);
  for (var i = 1; i <= res.pages; i++){
    (function(n){
      if (res.pages > 7 && n !== 1 && n !== res.pages && Math.abs(n - e.page) > 1){
        if (n === 2 || n === res.pages - 1) pg.appendChild(el('span','info','…'));
        return;
      }
      var b = el('button', n === e.page ? 'on' : '', String(n));
      b.onclick = function(){ e.page = n; rendre(); };
      pg.appendChild(b);
    })(i);
  }
  var suiv = el('button', null, '›'); suiv.disabled = e.page >= res.pages;
  suiv.onclick = function(){ e.page++; rendre(); };
  pg.appendChild(suiv);
  p.appendChild(pg);
  return p;
}

function choisirFichier(cb){
  var inp = $('#fichierImage');
  inp.value = '';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 8e6){ toast('Image trop lourde', 'Maximum 8 Mo', 'erreur'); return; }
    var lecteur = new FileReader();
    lecteur.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 900, w = im.width, h = im.height;
        if (w > max){ h = Math.round(h * max / w); w = max; }
        if (h > max){ w = Math.round(w * max / h); h = max; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(im, 0, 0, w, h);
        var data = cv.toDataURL('image/jpeg', 0.82);
        try{
          var id = T.ajouterMedia(f.name.replace(/\.[^.]+$/,''), data);
          cb(id);
          toast('Photo ajoutée', f.name, 'succes');
        }catch(err){
          toast('Enregistrement impossible', 'La mémoire du navigateur est pleine', 'erreur');
        }
      };
      im.src = lecteur.result;
    };
    lecteur.readAsDataURL(f);
  };
  inp.click();
}

/* ---------------------------------------------------------- tableau de bord */
function vueTableau(c){
  var jour = duJour();
  var ca = jour.reduce(function(a,x){ return a + x.total; }, 0);

  /* Tous les chiffres viennent des commandes réelles. Les mentions
     inventées — « +2 vs hier », « +18 % sur 7 jours », « objectif
     6 000 F » — s'affichaient à côté de zéros et ne voulaient rien dire. */
  var hier = new Date(D.livraison.getTime() - 864e5).toDateString();
  var nHier = cmds().filter(function(x){ return new Date(x.jourLivraison).toDateString() === hier; }).length;
  var ecart = jour.length - nHier;
  var depuis7 = new Date(Date.now() - 7 * 864e5);
  var ca7 = cmds().filter(function(x){ return new Date(x.creele) >= depuis7 && x.statut !== 'refusee'; })
                  .reduce(function(a, x){ return a + x.total; }, 0);
  /* Une commande encore « reçue » pour un jour déjà passé est en retard :
     c'est ce qui faisait dire « 0 commande » sous une liste de trois. */
  var retard = aValider().filter(function(x){
    return new Date(x.jourLivraison).toDateString() !== D.livraison.toDateString();
  }).length;

  var k = el('div','kpis');
  k.appendChild(kpi('Commandes ' + D.court, jour.length,
    retard ? '<b class="bas">' + retard + ' en retard</b> sur un autre jour'
           : (nHier ? (ecart >= 0 ? '+' : '') + ecart + ' vs hier' : '—')));
  k.appendChild(kpi('Chiffre d’affaires', F(ca), F(ca7) + ' sur 7 jours'));
  k.appendChild(kpi('Panier moyen', F(jour.length ? Math.round(ca/jour.length) : 0),
    jour.length ? 'sur ' + jour.length + ' commande' + (jour.length > 1 ? 's' : '') : 'aucune commande'));
  k.appendChild(kpi('À valider', aValider().length, aValider().length ? '<b class="bas">sous 15 min</b>' : 'tout est traité'));
  k.appendChild(kpi('Alertes stock', alertes().length, 'sur ' + idsProduits().length + ' produits'));
  c.appendChild(k);

  var g = el('div','grille2');
  var p1 = el('div','panneau-b');
  var t1 = el('div','tete'); t1.appendChild(el('h2', null, 'Commandes à traiter'));
  var f1 = el('div','fin');
  var v = el('button','btn creux petit'); v.textContent = 'Tout voir'; v.onclick = function(){ aller('commandes'); };
  f1.appendChild(v); t1.appendChild(f1); p1.appendChild(t1);
  var co = el('div','corps serre');
  var liste = cmds().filter(function(x){ return x.statut !== 'livree' && x.statut !== 'refusee'; }).slice(0,6);
  if (!liste.length) co.appendChild(el('p','vide','Aucune commande en attente.'));
  liste.forEach(function(x){ co.appendChild(ligneCommande(x)); });
  p1.appendChild(co); g.appendChild(p1);

  var col = el('div'); col.style.cssText = 'display:grid;gap:16px;align-content:start';
  var p2 = el('div','panneau-b');
  p2.appendChild(el('div','tete','<h2>Ventes des 7 derniers jours</h2>'));
  var c2 = el('div','corps'); c2.appendChild(graphique()); p2.appendChild(c2); col.appendChild(p2);

  var p3 = el('div','panneau-b');
  var t3 = el('div','tete'); t3.appendChild(el('h2', null, 'Alertes stock'));
  var f3 = el('div','fin');
  var vs = el('button','btn creux petit'); vs.textContent = 'Gérer'; vs.onclick = function(){ aller('stock'); };
  f3.appendChild(vs); t3.appendChild(f3); p3.appendChild(t3);
  var c3 = el('div','corps serre');
  if (!alertes().length) c3.appendChild(el('p','vide','Tous les stocks sont bons.'));
  alertes().slice(0,6).forEach(function(id){
    var p = T.produits[id];
    var r = el('div','cli-l');
    var im = el('img'); im.src = T.img(p.img); im.alt = '';
    im.style.cssText = 'width:38px;height:38px;border-radius:9px;object-fit:cover';
    r.appendChild(im);
    r.appendChild(el('span','n', p.nom + '<span>' + (T.etatStock(id) === 'epuise' ? 'épuisé' : 'plus que ' + p.stock) + '</span>'));
    var b = el('button','btn creux petit'); b.textContent = '+10';
    b.onclick = function(){ T.reapprovisionner(id, 10); toast(p.nom, 'Stock passé à ' + T.produits[id].stock, 'succes'); rendre(); };
    r.appendChild(b);
    c3.appendChild(r);
  });
  p3.appendChild(c3); col.appendChild(p3);
  g.appendChild(col); c.appendChild(g);

function kpi(lab, val, det){

function graphique(){

  var noms = ['L','M','M','J','V','S','D'], max = Math.max.apply(null, base);

function ligneCommande(x){
  var b = el('button','cmd');

  var act = el('span','act');
  var suivant = {recue:'validee', validee:'preparation', preparation:'route', route:'livree'}[x.statut];
  var libelle = {validee:'Valider', preparation:'Préparer', route:'En route', livree:'Livrée'}[suivant];
  if (suivant){
    var s = el('button', suivant === 'validee' ? 'btn petit' : 'btn creux petit', libelle);

  var liste = cmds().filter(function(x){
    if (etat.commandes.statut !== 'tous' && x.statut !== etat.commandes.statut) return false;
    var q = etat.commandes.q;
    return !q || (x.ref + ' ' + x.client.nom + ' ' + x.client.tel).toLowerCase().indexOf(q) > -1;
  });
  var res = pagine(liste, 'commandes');
  var corps = el('div','corps serre');
  if (!res.tranche.length) corps.appendChild(el('p','vide','Aucune commande pour ce filtre.'));
  res.tranche.forEach(function(x){ corps.appendChild(ligneCommande(x)); });
  p.appendChild(corps);
  p.appendChild(barrePagination(res, 'commandes'));
  c.appendChild(p);
}

/* Formulaire court dans le tiroir : sert à l'édition d'un membre. */

/* ---------------------------------------------------------- actions sur une commande
   Les boutons ne sont plus écrits en dur : ils viennent du cycle de vie et
   du rôle de la personne connectée. */
function actionsCommande(cmd, surClic){
  var z = el('div','actions');
  T.suivants(cmd.statut, mesDroits()).forEach(function(t){
    var b = el('button','btn petit' + (t.sombre ? ' creux' : ''));
    b.textContent = t.libelle;
    b.onclick = function(e){
      e.stopPropagation();
      if (t.vers === 'prete' && !T.toutPret(cmd) &&
          !confirm('Toutes les lignes ne sont pas cochées. Marquer la commande prête quand même ?')) return;
      if (t.vers === 'route' && !cmd.livreur){
        toast('Aucun livreur', 'Affectez d’abord un livreur à cette commande', 'alerte'); return;
      }
      if (t.vers === 'livree'){ confirmerLivraison(cmd); return; }
      changerStatut(cmd.ref, t.vers);
      if (surClic) surClic();
    };
    z.appendChild(b);
  });
  return z;
}
/* Livrer, c'est constater : qui a reçu, combien a été encaissé, et une
   photo si le livreur veut garder une trace. */
function confirmerLivraison(cmd){
  feuille(function(z){
    z.appendChild(el('h3', null, 'Livraison de ' + cmd.ref));
    z.appendChild(el('p','aide', cmd.client.nom + ' · ' + cmd.adresse + ' · ' + F(cmd.total)));

    var p = {recuPar:'', encaisse: cmd.paiement === 'especes' ? cmd.total : 0, photo:null, note:''};
    z.appendChild(champTexte('Reçue par (nom de la personne)', cmd.client.nom, function(v){ p.recuPar = v; }));
    p.recuPar = cmd.client.nom;

    if (cmd.paiement === 'especes'){
      z.appendChild(champTexte('Montant encaissé', cmd.total, function(v){ p.encaisse = Number(v) || 0; }));
    } else {
      z.appendChild(el('p','aide','Payé par ' + T.paiement(cmd.paiement).nom + ' : rien à encaisser.'));
    }
    z.appendChild(champTexte('Remarque (facultatif)', '', function(v){ p.note = v; }));

    z.appendChild(el('span','lab','Photo de la remise (facultatif)'));
    var ph = el('input'); ph.type = 'file'; ph.accept = 'image/*'; ph.capture = 'environment';
    ph.style.cssText = 'font-size:12.5px';
    var apercu = el('div','preuve'); apercu.style.display = 'none';
    ph.onchange = function(){
      var f = ph.files && ph.files[0]; if (!f) return;
      if (f.size > 4e6){ toast('Photo trop lourde', 'Maximum 4 Mo', 'alerte'); return; }
      var lec = new FileReader();
      lec.onload = function(){
        p.photo = lec.result;
        apercu.innerHTML = ''; var im = el('img'); im.src = p.photo; apercu.appendChild(im);
        apercu.style.display = '';
      };
      lec.readAsDataURL(f);
    };
    z.appendChild(ph); z.appendChild(apercu);

    var ok = el('button','btn plein grand');
    ok.textContent = 'Confirmer la livraison';
    ok.onclick = function(){
      var m = moi();
      T.majCommande(cmd.ref, {
        statut: 'livree',
        preuve: {quand:new Date().toISOString(), par: m ? m.nom : 'Livreur',
                 recuPar: p.recuPar, encaisse: p.encaisse, note: p.note, photo: p.photo}
      });
      T.tracer('Livraison confirmée', cmd.ref, p.recuPar + (p.encaisse ? ' · ' + F(p.encaisse) + ' encaissés' : ''));
      fermerTiroir();
      toast('Livrée', cmd.ref + ' · ' + p.recuPar, 'succes');
      rendre();
    };
    z.appendChild(ok);
  });
}

function choixLivreur(cmd, apres){
  var liste = T.livreurs();
  var z = el('div','dd-plat');
  if (!liste.length) return el('span','aide','Aucun livreur dans l’équipe');
  var sel = el('select','mini');
  var vide = el('option'); vide.value = ''; vide.textContent = 'Aucun livreur';
  sel.appendChild(vide);
  liste.forEach(function(u){
    var o = el('option'); o.value = u.id; o.textContent = u.nom;
    if (cmd.livreur === u.id) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function(e){
    e.stopPropagation();
    T.affecter(cmd.ref, sel.value);
    toast('Livreur', sel.value ? T.membre(sel.value).nom + ' est affecté' : 'Affectation retirée', 'info');
    if (apres) apres(); else rendre();
  };
  sel.onclick = function(e){ e.stopPropagation(); };
  z.appendChild(sel);
  return z;
}

/* ---------------------------------------------------------- préparation du jour
   Ce que la cuisine doit sortir demain matin, tous clients confondus.     */
function commandesAPreparer(){
  return cmds().filter(function(x){
    return ['validee','preparation','prete'].indexOf(x.statut) > -1 &&
           new Date(x.jourLivraison).toDateString() === D.livraison.toDateString();
  });
}
function commandesALivrer(){
  var m = moi();
  return cmds().filter(function(x){
    if (['prete','route','livree'].indexOf(x.statut) < 0) return false;
    if (new Date(x.jourLivraison).toDateString() !== D.livraison.toDateString()) return false;
    /* un livreur ne voit que sa tournée ; les autres postes voient tout */
    if (m && m.role === 'livreur') return x.livreur === m.id;
    return true;
  });
}
function vuePreparation(c){
  var liste = commandesAPreparer();
  var portions = liste.reduce(function(a,x){ return a + x.lignes.reduce(function(b,l){ return b + l.qte; }, 0); }, 0);
  var pretes = liste.filter(function(x){ return x.statut === 'prete'; }).length;

  var k = el('div','kpis');
  k.appendChild(kpi('Commandes à préparer', liste.length, 'pour ' + D.court));
  k.appendChild(kpi('Portions au total', portions, 'toutes commandes confondues'));
  k.appendChild(kpi('Prêtes', pretes, liste.length - pretes + ' en cours'));
  var premier = liste.filter(function(x){ return T.creneau(x.creneau).type === 'matin'; }).length;
  k.appendChild(kpi('Pour le matin', premier, liste.length - premier + ' pour le goûter'));
  c.appendChild(k);

  /* Vue d'ensemble : ce qu'il faut sortir, tous clients confondus. */
  var agrege = {};
  liste.forEach(function(x){
    x.lignes.forEach(function(l){
      var cle = l.id + '|' + l.fmt;
      if (!agrege[cle]) agrege[cle] = {nom:l.nom, img:l.img, fmt:l.fmt, qte:0};
      agrege[cle].qte += l.qte;
    });
  });
  var cles = Object.keys(agrege).sort(function(a,b){ return agrege[b].qte - agrege[a].qte; });
  var pt = el('div','panneau-b');
  var tt = el('div','tete');
  tt.appendChild(el('h2', null, 'Total à sortir pour ' + D.long));
  var ff = el('div','fin');
  var imp = el('button','btn creux petit'); imp.textContent = 'Imprimer';
  imp.onclick = function(){ window.print(); };
  ff.appendChild(imp); tt.appendChild(ff); pt.appendChild(tt);
  var ct = el('div','corps serre'); ct.id = 'zoneImpression';
  if (!cles.length) ct.appendChild(el('p','vide','Rien à préparer pour ' + D.court + '.'));
  cles.forEach(function(cle){
    var a = agrege[cle];
    var r = el('div','prep');
    r.appendChild(el('span','q', a.qte));
    var im = el('img'); im.src = T.img(a.img); im.alt = '';
    r.appendChild(im);
    r.appendChild(el('div','n', a.nom + '<span>' + a.fmt + '</span>'));
    ct.appendChild(r);
  });
  pt.appendChild(ct);
  c.appendChild(pt);

  /* Commande par commande : c'est ainsi qu'on cuisine et qu'on emballe. */
  liste.forEach(function(x){
    var faites = x.lignesFaites || {};
    var total = x.lignes.length;
    var faits = x.lignes.filter(function(l, i){ return faites[i + '|' + l.id]; }).length;
    var p = el('div','panneau-b');
    var t = el('div','tete');
    t.appendChild(el('h2', null, x.ref + ' · ' + x.client.nom));
    var f = el('div','fin');
    f.appendChild(el('span','etq', T.creneau(x.creneau).nom));
    f.appendChild(el('span','etq ' + T.statuts[x.statut].couleur, T.statuts[x.statut].nom));
    f.appendChild(el('span','etq' + (faits === total ? ' vert' : ''), faits + '/' + total));
    t.appendChild(f); p.appendChild(t);

    var corps = el('div','corps serre');
    x.lignes.forEach(function(l, i){
      var cle = i + '|' + l.id;
      var fait = !!faites[cle];
      var r = el('div','prep' + (fait ? ' fait' : ''));
      var coche = el('button','coche' + (fait ? ' on' : ''));
      coche.innerHTML = fait ? '✓' : '';
      coche.onclick = function(){
        T.marquerLigne(x.ref, cle, !fait);
        if (x.statut === 'validee') T.majCommande(x.ref, {statut:'preparation'});
        rendre();
      };
      r.appendChild(coche);
      r.appendChild(el('span','q', l.qte));
      var im = el('img'); im.src = T.img(l.img); im.alt = '';
      r.appendChild(im);
      r.appendChild(el('div','n', l.nom + '<span>' + l.fmt +
        (l.sup ? ' · ' + l.sup : '') + (l.note ? ' · « ' + l.note + ' »' : '') + '</span>'));
      corps.appendChild(r);
    });
    var pied = el('div','corps');
    pied.appendChild(actionsCommande(x));
    corps.appendChild(pied);
    p.appendChild(corps);
    c.appendChild(p);
  });
  if (!liste.length) c.appendChild(el('p','vide','Aucune commande validée pour ' + D.court + '.'));
}

/* ---------------------------------------------------------- tournée de livraison */
function vueTournee(c){
  var m = moi();
  var liste = commandesALivrer();
  var aLivrer = liste.filter(function(x){ return x.statut !== 'livree'; });
  var encaisser = aLivrer.filter(function(x){ return x.paiement === 'especes'; })
                         .reduce(function(a,x){ return a + x.total; }, 0);

  var k = el('div','kpis');
  k.appendChild(kpi(m && m.role === 'livreur' ? 'Ma tournée' : 'Livraisons du jour', liste.length, D.court));
  k.appendChild(kpi('Restant à livrer', aLivrer.length, liste.length - aLivrer.length + ' déjà livrées'));
  k.appendChild(kpi('À encaisser', F(encaisser), 'en espèces, sur la tournée'));
  var sans = cmds().filter(function(x){
    return x.statut === 'prete' && !x.livreur &&
           new Date(x.jourLivraison).toDateString() === D.livraison.toDateString();
  }).length;
  k.appendChild(kpi('Sans livreur', sans, sans ? 'à affecter' : 'tout est affecté'));
  c.appendChild(k);

  if (!liste.length){
    c.appendChild(el('p','vide', m && m.role === 'livreur'
      ? 'Aucune commande ne vous est affectée pour ' + D.court + '.'
      : 'Aucune commande prête à livrer pour ' + D.court + '.'));

  }

  T.creneaux.forEach(function(cr){
    var duCreneau = liste.filter(function(x){ return x.creneau === cr.id; });

      corps.appendChild(el('div','lab', T.zone(z).nom + ' · ' + T.zone(z).delai));

        r.appendChild(el('div','m', F(x.total) + '<span>' + T.statuts[x.statut].nom + '</span>'));

        var act = el('div','actions');
        var tel = el('a','icone'); tel.href = 'tel:' + String(x.client.tel).replace(/[^0-9+]/g,'');
        tel.title = 'Appeler'; tel.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg>';
        act.appendChild(tel);
        var carte = el('a','icone');
        carte.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(x.adresse + ', Abidjan');
        carte.target = '_blank'; carte.title = 'Itinéraire';
        carte.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
        act.appendChild(carte);
        if (jePeux('commandes') || jePeux('tout')) act.appendChild(choixLivreur(x));
        var suite = actionsCommande(x);
        Array.prototype.forEach.call(suite.children, function(b){ act.appendChild(b); });
        if (x.statut === 'livree') act.appendChild(el('span','etq vert','Livrée'));
        r.appendChild(act);
        r.onclick = function(e){ if (e.target.closest('.actions')) return; ouvrirCommande(x.ref); };
        corps.appendChild(r);
      });
    });
    p.appendChild(corps);
    c.appendChild(p);
  });

  /* Les commandes prêtes que personne n'a prises en charge. */
  var orphelines = cmds().filter(function(x){
    return x.statut === 'prete' && !x.livreur &&
           new Date(x.jourLivraison).toDateString() === D.livraison.toDateString();
  });
  if (orphelines.length && (jePeux('commandes') || jePeux('tout'))){
    var po = el('div','panneau-b');
    po.appendChild(el('div','tete','<h2>Prêtes, sans livreur</h2>'));
    var co = el('div','corps serre');
    orphelines.forEach(function(x){
      var r = el('div','arret');
      r.appendChild(el('span','pas-num','!'));
      r.appendChild(el('div','n', x.client.nom + '<span>' + T.zone(x.zone).nom + ' · ' + x.ref + '</span>'));
      r.appendChild(el('div','m', F(x.total)));
      var act = el('div','actions');
      act.appendChild(choixLivreur(x));
      r.appendChild(act);
      co.appendChild(r);
    });
    po.appendChild(co);
    c.appendChild(po);
  }
}

/* ---------------------------------------------------------- caisse du jour */
function vueCaisseJour(c){
  var liste = duJour();
  var livrees = liste.filter(function(x){ return x.statut === 'livree'; });
  var parMoyen = {};
  T.paiements.forEach(function(p){ parMoyen[p.id] = {nom:p.nom, logo:p.logo, n:0, montant:0}; });
  livrees.forEach(function(x){
    var m = parMoyen[x.paiement] || (parMoyen[x.paiement] = {nom:x.paiement, n:0, montant:0});
    m.n++; m.montant += x.total;
  });
  var encaisse = livrees.reduce(function(a,x){ return a + x.total; }, 0);
  var attendu = liste.filter(function(x){ return x.statut !== 'refusee'; }).reduce(function(a,x){ return a + x.total; }, 0);

  var k = el('div','kpis');
  k.appendChild(kpi('Encaissé', T.F(encaisse), livrees.length + ' commandes livrées'));
  k.appendChild(kpi('Attendu sur la journée', T.F(attendu), liste.length + ' commandes'));
  k.appendChild(kpi('Reste à encaisser', T.F(attendu - encaisse), (liste.length - livrees.length) + ' en cours'));
  k.appendChild(kpi('Panier moyen', T.F(livrees.length ? Math.round(encaisse/livrees.length) : 0), 'sur les livrées'));
  c.appendChild(k);

  var p = el('div','panneau-b');
  p.appendChild(el('div','tete','<h2>Répartition par moyen de paiement</h2>'));
  var corps = el('div','corps serre');
  Object.keys(parMoyen).forEach(function(id){
    var m = parMoyen[id];
    var r = el('div','rang');
    if (m.logo){ var im = el('img'); im.src = m.logo; im.alt = ''; im.style.cssText = 'height:24px;width:auto'; r.appendChild(im); }
    r.appendChild(el('div','tx','<b>' + m.nom + '</b><span>' + m.n + ' commande' + (m.n > 1 ? 's' : '') + '</span>'));
    var part = encaisse ? Math.round(m.montant / encaisse * 100) : 0;
    r.appendChild(el('span','etq', part + ' %'));
    r.appendChild(el('span', null, '<b style="font-family:var(--titre);font-size:15px">' + T.F(m.montant) + '</b>'));
    corps.appendChild(r);
  });
  p.appendChild(corps);
  c.appendChild(p);

  var p2 = el('div','panneau-b');
  p2.appendChild(el('div','tete','<h2>Détail des encaissements</h2>'));
  var c2 = el('div','corps serre');
  if (!livrees.length) c2.appendChild(el('p','vide','Aucune commande livrée pour l\u2019instant.'));
  livrees.forEach(function(x){
    var b = el('button','cmd');
    b.appendChild(el('span','ref', x.ref));
    b.appendChild(el('span','cli', x.client.nom + '<span>' + T.zone(x.zone).nom + '</span>'));
    b.appendChild(el('span','det', T.paiement(x.paiement).nom));
    b.appendChild(el('span','tot', T.F(x.total)));
    b.onclick = function(){ ouvrirCommande(x.ref); };
    c2.appendChild(b);
  });
  p2.appendChild(c2);
  c.appendChild(p2);

  /* Clôture : on fige le compte de la journée, et on le garde. */
  var jourCle = D.livraison.toISOString().slice(0,10);
  var deja = T.clotures().filter(function(x){ return x.jour === jourCle; })[0];

  var pc = el('div','panneau-b');
  pc.appendChild(el('div','tete','<h2>Clôture de la journée</h2>'));
  var cc = el('div','corps');
  if (deja){
    cc.appendChild(el('p','aide','Journée déjà clôturée le ' + T.dateCourte(deja.quand) +
      ' à ' + T.heure(deja.quand) + ' par ' + deja.par + '.'));
  } else {
    cc.appendChild(el('p','aide','Fige le compte du jour : ' + livrees.length + ' commande' +
      (livrees.length > 1 ? 's' : '') + ' livrée' + (livrees.length > 1 ? 's' : '') + ', ' + F(encaisse) +
      ' encaissés. Les commandes non livrées resteront ouvertes.'));
    var cl = el('button','btn plein');
    cl.textContent = 'Clôturer la journée · ' + F(encaisse);
    cl.onclick = function(){
      if (!confirm('Clôturer la journée ? Le récapitulatif sera figé.')) return;
      var m = moi();
      var rapport = {
        jour: jourCle, quand: new Date().toISOString(), par: m ? m.nom : 'Inconnu',
        encaisse: encaisse, attendu: attendu, commandes: liste.length, livrees: livrees.length,
        panier: livrees.length ? Math.round(encaisse / livrees.length) : 0,
        parMoyen: Object.keys(parMoyen).map(function(id){
          return {id:id, nom:parMoyen[id].nom, n:parMoyen[id].n, montant:parMoyen[id].montant};
        }),
        remises: liste.reduce(function(a,x){ return a + (x.remise || 0); }, 0)
      };
      if (!T.cloturer(rapport)){ toast('Déjà clôturée', null, 'alerte'); return; }
      toast('Journée clôturée', F(encaisse) + ' encaissés', 'succes');
      rendre();
    };
    cc.appendChild(cl);
  }
  pc.appendChild(cc);
  c.appendChild(pc);

  var hist = T.clotures();
  if (hist.length){
    var ph = el('div','panneau-b');
    ph.appendChild(el('div','tete','<h2>Journées clôturées</h2>'));
    var ch2 = el('div','corps serre');
    hist.slice(0, 30).forEach(function(r){
      var rr = el('div','rang');
      rr.appendChild(el('div','tx','<b>' + new Date(r.jour).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}) +
        '</b><span>' + r.livrees + ' livrées sur ' + r.commandes + ' · panier moyen ' + F(r.panier) +
        (r.remises ? ' · ' + F(r.remises) + ' de remises' : '') + ' · clôturée par ' + r.par + '</span>'));
      rr.appendChild(el('span', null, '<b style="font-family:var(--titre);font-size:15px">' + F(r.encaisse) + '</b>'));
      ch2.appendChild(rr);
    });
    ph.appendChild(ch2);
    c.appendChild(ph);
  }
}

function editerMembre(u){
  var nouveau = !u;
  u = u ? JSON.parse(JSON.stringify(u)) : {id:'u' + Date.now(), nom:'', role:'cuisine', tel:'', code:'', actif:true};
  feuille(function(z){
    z.appendChild(el('h3', null, nouveau ? 'Nouveau membre' : 'Modifier ' + u.nom));
    var f1 = champTexte('Nom complet', u.nom, function(v){ u.nom = v; });
    var f2 = champTexte('Téléphone', u.tel, function(v){ u.tel = v; });
    var f3 = champTexte('Code d’accès (4 à 6 chiffres)', u.code, function(v){ u.code = v; });
    z.appendChild(f1); z.appendChild(f2); z.appendChild(f3);
    z.appendChild(el('span','lab','Rôle'));
    var ch = el('div','choix');
    Object.keys(T.roles).forEach(function(cle){
      var b = el('button', null, T.roles[cle].nom);
      b.setAttribute('aria-pressed', u.role === cle);
      b.onclick = function(){
        u.role = cle;
        Array.prototype.forEach.call(ch.children, function(x,i){
          x.setAttribute('aria-pressed', Object.keys(T.roles)[i] === cle);
        });
      };
      ch.appendChild(b);
    });
    z.appendChild(ch);
    var ok = el('button','btn plein grand');
    ok.textContent = nouveau ? 'Créer le membre' : 'Enregistrer';
    ok.onclick = function(){
      if (!u.nom.trim()){ toast('Nom manquant', null, 'alerte'); return; }
      if (!/^[0-9]{4,6}$/.test(String(u.code))){ toast('Code invalide', '4 à 6 chiffres', 'alerte'); return; }
      var l = T.equipe();
      var i = -1;
      l.forEach(function(x, k){ if (x.id === u.id) i = k; });
      if (i > -1) l[i] = u; else l.push(u);
      T.sauverEquipe(l);
      fermerTiroir();
      toast(u.nom, nouveau ? 'Membre ajouté' : 'Modifié', 'succes');
      rendre();
    };
    z.appendChild(ok);
  });
}
function champTexte(libelle, valeur, surSaisie){
  var w = el('div','champ');
  w.appendChild(el('label','lab', libelle));
  var i = el('input'); i.type = 'text'; i.value = valeur || '';
  i.oninput = function(){ surSaisie(i.value); };
  w.appendChild(i);
  return w;
}

function ajouterFermeture(){
  feuille(function(z){
    z.appendChild(el('h3', null, 'Fermer un jour'));
    var f = {jour:'', motif:''};
    var w = el('div','champ');
    w.appendChild(el('label','lab','Quel jour ?'));
    var jours = el('div','jours-g');
    for (var i = 0; i < 21; i++){
      var dte = new Date(Date.now() + i * 864e5);
      var cle = dte.toISOString().slice(0,10);
      var b = el('button');
      b.innerHTML = '<span class="j">' + dte.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','') + '</span>' +
        '<span class="d">' + dte.getDate() + '</span>' +
        '<span class="m">' + dte.toLocaleDateString('fr-FR',{month:'short'}).replace('.','') + '</span>';
      (function(c2, bt){
        bt.onclick = function(){
          f.jour = c2;
          Array.prototype.forEach.call(jours.children, function(x){ x.setAttribute('aria-pressed', x === bt); });
        };
      })(cle, b);
      jours.appendChild(b);
    }
    w.appendChild(jours);
    z.appendChild(w);
    z.appendChild(champTexte('Motif (visible par l’équipe)', '', function(v){ f.motif = v; }));
    var ok = el('button','btn plein grand');
    ok.textContent = 'Fermer ce jour';
    ok.onclick = function(){
      if (!f.jour){ toast('Choisissez un jour', null, 'alerte'); return; }
      if (T.fermetures().filter(function(x){ return x.jour === f.jour; }).length){
        toast('Déjà fermé', null, 'alerte'); return;
      }
      T.ajouterFermeture(f);
      T.tracer('Fermeture ajoutée', f.jour, f.motif);
      fermerTiroir(); toast('Jour fermé', f.motif || '', 'succes'); rendre();
    };
    z.appendChild(ok);
  });
}

function editerPromo(pr){
  var nouveau = !pr;
  pr = pr ? JSON.parse(JSON.stringify(pr))
          : {code:'', type:'pourcent', valeur:10, minimum:0, actif:true, usages:0, limite:0, libelle:'', premiereSeule:false};
  var ancien = pr.code;
  feuille(function(z){
    z.appendChild(el('h3', null, nouveau ? 'Nouveau code' : 'Modifier ' + pr.code));
    z.appendChild(champTexte('Code (en majuscules)', pr.code, function(v){ pr.code = v.toUpperCase().replace(/[^A-Z0-9]/g,''); }));
    z.appendChild(champTexte('Libellé montré au client', pr.libelle, function(v){ pr.libelle = v; }));

    z.appendChild(el('span','lab','Type de remise'));
    var ch = el('div','choix');
    var types = [['pourcent','Pourcentage'],['montant','Montant fixe'],['livraison','Livraison offerte']];
    types.forEach(function(o){
      var b = el('button', null, o[1]);
      b.setAttribute('aria-pressed', pr.type === o[0]);
      b.onclick = function(){
        pr.type = o[0];
        Array.prototype.forEach.call(ch.children, function(x,i){ x.setAttribute('aria-pressed', types[i][0] === o[0]); });
        champVal.style.display = o[0] === 'livraison' ? 'none' : '';
      };
      ch.appendChild(b);
    });
    z.appendChild(ch);

    var champVal = champTexte('Valeur (% ou francs)', pr.valeur, function(v){ pr.valeur = Number(v) || 0; });
    champVal.style.display = pr.type === 'livraison' ? 'none' : '';
    z.appendChild(champVal);
    z.appendChild(champTexte('Montant minimum de commande', pr.minimum, function(v){ pr.minimum = Number(v) || 0; }));
    z.appendChild(champTexte('Limite d’utilisations (0 = illimité)', pr.limite, function(v){ pr.limite = Number(v) || 0; }));

    var lab = el('label','bascule');
    var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!pr.premiereSeule;
    cb.onchange = function(){ pr.premiereSeule = cb.checked; };
    lab.appendChild(cb);
    lab.appendChild(el('span', null, 'Réservé à la première commande d’un client'));
    z.appendChild(lab);

    var ok = el('button','btn plein grand');
    ok.textContent = nouveau ? 'Créer le code' : 'Enregistrer';
    ok.onclick = function(){
      if (!/^[A-Z0-9]{3,20}$/.test(pr.code)){ toast('Code invalide', '3 à 20 lettres ou chiffres', 'alerte'); return; }
      if (!pr.libelle.trim()) pr.libelle = pr.type === 'pourcent' ? pr.valeur + ' % de remise'
                                        : pr.type === 'montant' ? F(pr.valeur) + ' de remise'
                                        : 'Livraison offerte';
      var l = T.promos();
      var doublon = l.filter(function(x){ return x.code === pr.code && x.code !== ancien; }).length;
      if (doublon){ toast('Ce code existe déjà', null, 'alerte'); return; }
      var i = -1; l.forEach(function(x, k){ if (x.code === ancien) i = k; });
      if (i > -1) l[i] = pr; else l.push(pr);
      T.sauverPromos(l);
      T.tracer(nouveau ? 'Code promo créé' : 'Code promo modifié', pr.code, pr.libelle);
      fermerTiroir(); toast(pr.code, nouveau ? 'Créé' : 'Modifié', 'succes'); rendre();
    };
    z.appendChild(ok);
  });
}

    }).join(' ') || '<span class="etq rouge">aucune</span>';
    var td2 = el('td', null, '<div class="puces">' + cats + '</div>'); td2.setAttribute('data-lab','Catégories'); tr.appendChild(td2);
    var td3 = el('td','px', pr.formats.map(function(f2){ return f2[0] + ' ' + F(f2[1]); }).join('<br>'));

/* ---------------------------------------------------------- éditeur produit */
function editerProduit(id){
  var pr = T.produits[id];
  if (!pr) return;
  var b = JSON.parse(JSON.stringify(pr));
  b.sup = b.sup || [];
  var ti = $('#tiroir'); ti.innerHTML = '';

  var tete = el('div','tete');
  tete.appendChild(el('div', null, '<h3>Fiche produit</h3><div style="font-size:11.5px;color:var(--doux)">' + id + '</div>'));
  var fx = el('button','fermer','✕'); fx.onclick = fermerTiroir; tete.appendChild(fx);
  ti.appendChild(tete);
  var dd2 = el('div','dedans');

  /* photo en grand + actions */
  var ph = el('div','ed-photo');
  var apercu = el('img'); apercu.src = T.img(b.img); apercu.alt = '';
  ph.appendChild(apercu);
  var sur = el('div','sur');
  var bChanger = el('button','btn creux petit'); bChanger.textContent = 'Choisir une photo';
  bChanger.style.background = 'rgba(255,255,255,.92)'; bChanger.style.color = '#241A12'; bChanger.style.borderColor = 'transparent';
  var bAjouter = el('button','btn petit'); bAjouter.innerHTML = IC.photo + ' Téléverser';
  sur.appendChild(bChanger); sur.appendChild(bAjouter);
  ph.appendChild(sur);
  dd2.appendChild(ph);

  var galBloc = el('div','bloc-ed'); galBloc.hidden = true;
  var gt = el('div','t'); gt.appendChild(el('h5', null, 'Bibliothèque d’images'));
  var gf = el('div','fin');
  var gFerme = el('button','icone'); gFerme.innerHTML = '✕'; gFerme.onclick = function(){ galBloc.hidden = true; };
  gf.appendChild(gFerme); gt.appendChild(gf);
  galBloc.appendChild(gt);
  var gal = el('div','gal');
  galBloc.appendChild(gal);
  dd2.appendChild(galBloc);

  function rendreGalerie(){
    gal.innerHTML = '';
    var ajout = el('button','ajout');
    ajout.innerHTML = IC.photo + '<span>Ajouter</span>';
    ajout.onclick = function(){ choisirFichier(function(mid){ b.img = mid; apercu.src = T.img(mid); rendreGalerie(); }); };
    gal.appendChild(ajout);
    T.tousVisuels().forEach(function(v){
      var bt = el('button');
      bt.setAttribute('aria-pressed', b.img === v);
      var i = el('img'); i.src = T.img(v); i.alt = v;
      bt.appendChild(i);
      if (T.medias[v]){
        var s = el('span','sup','✕');
        s.onclick = function(e){
          e.stopPropagation();
          if (!confirm('Supprimer cette image de la bibliothèque ?')) return;
          T.supprimerMedia(v);
          if (b.img === v){ b.img = T.visuels[0]; apercu.src = T.img(b.img); }
          rendreGalerie();
          toast('Image supprimée', null, 'alerte');
        };
        bt.appendChild(s);
      }
      bt.onclick = function(){
        b.img = v; apercu.src = T.img(v);
        Array.prototype.forEach.call(gal.querySelectorAll('button'), function(x){
          var im2 = x.querySelector('img');
          x.setAttribute('aria-pressed', !!im2 && im2.alt === v);
        });
      };
      gal.appendChild(bt);
    });
  }
  bChanger.onclick = function(){ galBloc.hidden = !galBloc.hidden; if (!galBloc.hidden) rendreGalerie(); };
  bAjouter.onclick = function(){ choisirFichier(function(mid){ b.img = mid; apercu.src = T.img(mid); galBloc.hidden = false; rendreGalerie(); }); };

  /* identité */
  var bi = el('div','bloc-ed');
  bi.appendChild(el('div','t','<h5>Identité</h5>'));
  bi.appendChild(champ('Nom du produit', 'text', b.nom, function(v){ b.nom = v; }));
  var dsc = champ('Description', 'text', b.desc, function(v){ b.desc = v; });
  dsc.style.marginTop = '10px';
  bi.appendChild(dsc);
  var tg = champ('Mention affichée (Nouveau, Le plus commandé…)', 'text', b.tag || '', function(v){ b.tag = v; });
  tg.style.marginTop = '10px';
  bi.appendChild(tg);
  dd2.appendChild(bi);

  /* prix */
  var bp = el('div','bloc-ed');
  var tp = el('div','t'); tp.appendChild(el('h5', null, 'Formats et prix'));
  var fp = el('div','fin');
  var addF = el('button','btn creux petit'); addF.innerHTML = IC.plus + ' Format';
  addF.onclick = function(){ b.formats.push(['Nouveau format', 1000]); rendreFormats(); };
  fp.appendChild(addF); tp.appendChild(fp); bp.appendChild(tp);
  var boxF = el('div'); bp.appendChild(boxF);
  function rendreFormats(){
    boxF.innerHTML = '';
    b.formats.forEach(function(fmt, i){
      var r = el('div','ligne-fmt');
      var n = el('input'); n.type = 'text'; n.value = fmt[0]; n.placeholder = 'Nom du format';
      n.oninput = function(){ b.formats[i][0] = n.value; };
      var m = el('div','mont');
      var p2 = el('input'); p2.type = 'number'; p2.value = fmt[1]; p2.step = 100; p2.min = 0;
      p2.oninput = function(){ b.formats[i][1] = Number(p2.value); };
      m.appendChild(p2); m.appendChild(el('span','u','F'));
      r.appendChild(n); r.appendChild(m);
      if (b.formats.length > 1){
        var x = el('button','icone rouge'); x.innerHTML = IC.poubelle;
        x.onclick = function(){ b.formats.splice(i,1); rendreFormats(); };
        r.appendChild(x);
      }
      boxF.appendChild(r);
    });
  }
  rendreFormats();
  dd2.appendChild(bp);

  /* catégories */
  var bc = el('div','bloc-ed');
  bc.appendChild(el('div','t','<h5>Catégories</h5>'));
  var puces = el('div','puce-cat');
  T.categories.forEach(function(cat){
    if (cat.parJour) return;
    var actif = (cat.produits || []).indexOf(id) > -1;
    var bt = el('button');
    bt.setAttribute('aria-pressed', actif);
    bt.innerHTML = '<span class="c">' + (actif ? '✓' : '') + '</span>' + cat.nom;
    bt.onclick = function(){
      T.basculerCategorie(cat.id, id);
      var on = (T.categorie(cat.id).produits || []).indexOf(id) > -1;
      bt.setAttribute('aria-pressed', on);
      bt.querySelector('.c').textContent = on ? '✓' : '';
      toast(cat.nom, on ? 'Produit ajouté' : 'Produit retiré', 'info');
    };
    puces.appendChild(bt);
  });
  bc.appendChild(puces);
  bc.appendChild(el('p','aide','Le menu du jour se règle dans « Menu de la semaine ».'));
  dd2.appendChild(bc);

  /* suppléments */
  var bs = el('div','bloc-ed');
  var ts = el('div','t'); ts.appendChild(el('h5', null, 'Suppléments'));
  var fs = el('div','fin');
  var addS = el('button','btn creux petit'); addS.innerHTML = IC.plus + ' Supplément';
  addS.onclick = function(){ b.sup.push({nom:'Supplément', prix:0}); rendreSup(); };
  fs.appendChild(addS); ts.appendChild(fs); bs.appendChild(ts);
  var boxS = el('div'); bs.appendChild(boxS);
  function rendreSup(){
    boxS.innerHTML = '';
    if (!b.sup.length) boxS.appendChild(el('p','aide','Aucun supplément proposé.'));
    b.sup.forEach(function(s, i){
      var r = el('div','ligne-fmt');
      var n = el('input'); n.type = 'text'; n.value = s.nom;
      n.oninput = function(){ b.sup[i].nom = n.value; };
      var m = el('div','mont');
      var p3 = el('input'); p3.type = 'number'; p3.value = s.prix; p3.step = 100; p3.min = 0;
      p3.oninput = function(){ b.sup[i].prix = Number(p3.value); };
      m.appendChild(p3); m.appendChild(el('span','u','F'));
      var x = el('button','icone rouge'); x.innerHTML = IC.poubelle;
      x.onclick = function(){ b.sup.splice(i,1); rendreSup(); };
      r.appendChild(n); r.appendChild(m); r.appendChild(x);
      boxS.appendChild(r);
    });
  }
  rendreSup();
  dd2.appendChild(bs);

  /* disponibilité */
  var bd = el('div','bloc-ed');
  bd.appendChild(el('div','t','<h5>Disponibilité</h5>'));
  var deux = el('div','deux-ch');
  deux.appendChild(champ('Stock du jour', 'number', b.stock, function(v){ b.stock = Number(v); }));
  deux.appendChild(champ('Seuil d’alerte', 'number', b.seuil || 5, function(v){ b.seuil = Number(v); }));
  bd.appendChild(deux);
  var rg = el('div','rang'); rg.style.padding = '12px 0 0'; rg.style.borderBottom = '0';
  rg.appendChild(el('div','tx','<b>En vente</b><span>décoché, le produit disparaît de la carte</span>'));
  var bas = el('button','bascule' + (b.actif !== false ? ' on' : ''));
  bas.innerHTML = '<i></i>';
  bas.onclick = function(){ b.actif = !(b.actif !== false); bas.classList.toggle('on', b.actif); };
  rg.appendChild(bas);
  bd.appendChild(rg);
  dd2.appendChild(bd);

  ti.appendChild(dd2);

  var pied = el('div','pied');
  var sv = el('button','btn plein'); sv.textContent = 'Enregistrer les modifications';
  sv.onclick = function(){
    T.majProduit(id, b);
    toast('Fiche enregistrée', b.nom, 'succes');
    fermerTiroir(); rendre();
  };
  var ep = el('button','btn creux plein');
  ep.textContent = T.etatStock(id) === 'epuise' ? 'Remettre en stock (+10)' : 'Marquer épuisé maintenant';
  ep.onclick = function(){
    if (T.etatStock(id) === 'epuise'){ T.reapprovisionner(id, 10); toast('Remis en stock', pr.nom, 'succes'); }
    else { T.marquerEpuise(id); toast('Marqué épuisé', pr.nom, 'alerte'); }
    fermerTiroir(); rendre();
  };
  pied.appendChild(sv); pied.appendChild(ep);
  ti.appendChild(pied);
  ouvrirTiroir();
}
function champ(lab, type, valeur, onch){
  var c = el('div','champ');
  c.appendChild(el('label','lab', lab));
  var i = el('input'); i.type = type; i.value = valeur == null ? '' : valeur;
  if (type === 'number') i.min = 0;
  i.oninput = function(){ onch(i.value); };
  c.appendChild(i);
  return c;
}

    moins.onclick = function(){ T.majStock(id, (T.produits[id].stock||0) - 1); rendre(); };
    plus.onclick  = function(){ T.majStock(id, (T.produits[id].stock||0) + 1); rendre(); };

    ctl.appendChild(moins); ctl.appendChild(inp); ctl.appendChild(plus);
